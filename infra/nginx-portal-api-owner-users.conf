# AE-IT nginx vhosts (excerpt for portal /api owner-users)
# Merge `location /api/` into the ae-it.ru / www.ae-it.ru server block.
#
# Full deploy:
#   scp infra/nginx-ae-it-platform.conf root@80.78.253.210:/etc/nginx/sites-available/ae-it
#   ssh root@80.78.253.210 'nginx -t && systemctl reload nginx'

server {
    listen 80;
    server_name ae-it.ru www.ae-it.ru;
    root /var/www/ae-it.ru/portal;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Owner panel → create Node API (POST /api/owner/users)
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Self-hosted Supabase (Kong)
    location /supabase-api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host supabase.pixelwaverf.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
